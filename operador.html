<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zane Park — Chamar carro</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="app-bg">
  <main class="operator-card">
    <div class="topline">
      <div class="brand"><span class="brand-mark">≈</span><span>ZANE PARK</span></div>
      <button class="link-btn" id="logout">Sair</button>
    </div>
    <div class="user-pill">Operador: <strong id="operator"></strong></div>

    <h1>Chamar carro</h1>

    <label>Modelo do carro
      <input id="model" maxlength="40" placeholder="Ex.: Corolla">
    </label>

    <label>Placa
      <input id="plate" maxlength="8" autocapitalize="characters"
             placeholder="Digite a placa" autocomplete="off">
      <span class="hint">Digite a placa livremente, com ou sem hífen.</span>
    </label>

    <button class="btn primary call-btn" id="call">CHAMAR CARRO</button>
    <p id="status" class="status"></p>
  </main>

<script>
const operator = sessionStorage.getItem("operator");
if (!operator || operator === "ADM") location.href = "/login.html";
document.getElementById("operator").textContent = operator;

document.getElementById("call").onclick = async () => {
  const model = document.getElementById("model").value.trim();
  const plate = document.getElementById("plate").value.trim();
  const status = document.getElementById("status");
  if (!model || !plate) {
    status.textContent = "Informe o modelo e a placa.";
    status.className = "status error";
    return;
  }
  const btn = document.getElementById("call");
  btn.disabled = true;
  const r = await fetch("/api/calls", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model, plate, operator})
  });
  const data = await r.json();
  btn.disabled = false;
  if (!r.ok) {
    status.textContent = data.message || "Não foi possível chamar.";
    status.className = "status error";
    return;
  }
  status.textContent = "Carro chamado com sucesso!";
  status.className = "status success";
  document.getElementById("model").value = "";
  document.getElementById("plate").value = "";
  document.getElementById("model").focus();
};

document.getElementById("logout").onclick = () => {
  sessionStorage.clear();
  location.href = "/login.html";
};
</script>
</body>
</html>
