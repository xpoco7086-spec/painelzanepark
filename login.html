<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="/styles.css"></head><body class="center"><main class="card"><h1>ZANE PARK</h1><select id="o"><option>Bali</option><option>Pergoletta</option><option>Cão Veio</option><option>Estacionamento</option></select><input id="p" type="password" placeholder="Senha"><button onclick="go()">Entrar</button><p id="m"></p></main><script>async function go(){let operator=o.value,password=p.value,r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({operator,password})}),d=await r.json();if(d.ok){sessionStorage.operator=operator;location="/operador.html"}else m.textContent=d.message}</script></body></html>
