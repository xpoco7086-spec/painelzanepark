<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zane Park — Central de Rádio</title>
<style>
:root{color-scheme:dark}body{font:16px Arial,sans-serif;background:#0c1018;color:#fff;max-width:760px;margin:32px auto;padding:0 18px}h1{color:#ff3945}section{background:#192231;border-radius:12px;padding:18px;margin:16px 0}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #667080;background:#101824;color:white}input,select{box-sizing:border-box;width:100%}button{cursor:pointer;background:#c91f2c;border:0;margin:10px 6px 0 0}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#bfc9d9}#log{white-space:pre-wrap;max-height:260px;overflow:auto;font-size:14px}strong{color:#f7d274}
</style></head><body>
<h1>ZANE PARK — CENTRAL DE RÁDIO</h1>
<p class="muted">Recebe chamadas dos operadores. Antes da voz, fala Pátio, atenção! e aguarda 3 segundos. A transmissão pelo rádio exige interface PTT configurada separadamente.</p>
<section>
<label for="server">Endereço do painel</label><input id="server" value="https://painelzanepark.onrender.com" spellcheck="false">
<label for="key">Chave RADIO_KEY (não compartilhe)</label><input id="key" type="password" autocomplete="off">
<label for="voice">Voz em português (prefira feminina, se disponível)</label><select id="voice"><option>Carregando vozes...</option></select>
<label for="rate">Velocidade</label><select id="rate"><option value="0.85">0,85</option><option value="0.95" selected>0,95 — natural</option><option value="1">1,00</option></select>
<div><button id="start">Iniciar central</button><button id="stop" disabled>Parar central</button><button id="test">Testar voz</button></div>
<p id="status" role="status">Desligada</p>
</section>
<section><h2>Fila e últimas chamadas</h2><p id="queue">Nenhuma chamada aguardando.</p><div id="log"></div></section>
<script>
const $ = id => document.getElementById(id);
let running=false, lastId=0, queue=[], speaking=false, voices=[], timer=null, generation=0;
let audioCtx=null, activeTest=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function refreshVoices(){
 voices=speechSynthesis.getVoices();const select=$('voice'),previous=select.value;
 select.replaceChildren();
 const pt=voices.map((v,i)=>({v,i})).filter(x=>x.v.lang.toLowerCase().startsWith('pt'));
 for(const {v,i} of pt){const o=document.createElement('option');o.value=String(i);o.textContent=`${v.name} (${v.lang})`;select.append(o)}
 if(!pt.length){const o=document.createElement('option');o.textContent='Nenhuma voz em português encontrada';select.append(o)}
 if([...select.options].some(o=>o.value===previous))select.value=previous;
 else{const google=[...select.options].find(o=>/google/i.test(o.textContent));if(google)select.value=google.value}
}
refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices;
function plateSpoken(plate){
 const chars=String(plate||'').replace(/[^\p{L}\p{N}]/gu,'').slice(-4).toUpperCase();
 return [...chars].join(' ');
}
function spokenOrigin(value){return String(value||'').replace(/cão\s+veio/gi,'Cão Vèio');}
function sentence(c){return `Pátio, saindo ${c.model}, ${plateSpoken(c.plate)}, ${spokenOrigin(c.origin||c.operator)}.`;}
function say(text,gen){return new Promise(resolve=>{
 if(gen!==generation)return resolve();
 const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=Number($('rate').value);u.pitch=1;u.volume=1;
 const selected=voices[Number($('voice').value)];if(selected)u.voice=selected;
 u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
});}
// Fala "Pátio, atenção!", espera 3 segundos e anuncia o veículo duas vezes.
async function announce(c,gen){
 if(gen!==generation)return;
 await say('Pátio, atenção!',gen);
 if(gen!==generation)return;
 await sleep(3000);
 if(gen!==generation)return;
 const texto=sentence(c).replace(/^Pátio,\s*/i,'');
 await say(texto,gen);
 if(gen!==generation)return;
 await sleep(2500);
 if(gen!==generation)return;
 await say('Pátio, atenção! '+texto,gen);
}
function log(line){const p=document.createElement('p');p.textContent=`${new Date().toLocaleTimeString('pt-BR')} — ${line}`;$('log').prepend(p);}
function showQueue(){$('queue').textContent=queue.length?queue.map(c=>`${c.origin}: ${c.model} ${c.plate}`).join(' | '):'Nenhuma chamada aguardando.';}
async function processQueue(){
 if(speaking||activeTest)return;
 speaking=true;const gen=generation;
 try{
  while(running&&queue.length&&gen===generation){
   const c=queue.shift();showQueue();log('Preparando chamada: '+sentence(c));
   await announce(c,gen);
   if(!running||gen!==generation)break;
   log('Duas chamadas concluídas: '+c.model+' '+c.plate);
  }
 }catch(e){log('Erro de áudio: '+e.message)}
 finally{speaking=false;if(running&&queue.length&&gen===generation)processQueue();}
}
async function poll(){if(!running)return;
 try{const base=$('server').value.trim().replace(/\/$/,'');
   const resp=await fetch(`${base}/api/radio/calls?after=${lastId}`,{headers:{'x-radio-key':$('key').value},cache:'no-store'});
   const data=await resp.json();if(!resp.ok||!data.ok)throw Error(data.message||'Falha HTTP '+resp.status);
   for(const c of data.calls){if(c.id>lastId){lastId=c.id;queue.push(c);log('Recebido: '+c.model+' '+c.plate+' — '+c.origin);}}
   showQueue();$('status').textContent='Conectada — aguardando veículos';processQueue();
 }catch(e){$('status').textContent='Erro: '+e.message;}
 if(running)timer=setTimeout(poll,1000);
}
$('start').onclick=async()=>{
 if(!$('key').value.trim())return alert('Informe a RADIO_KEY configurada no Render.');
 // Libera o áudio a partir do clique do usuário (exigência de alguns navegadores).
 try{const C=window.AudioContext||window.webkitAudioContext;if(C){audioCtx=audioCtx||new C();await audioCtx.resume();}}catch(e){log('Aviso de áudio: '+e.message)}
 running=true;generation++;queue=[];lastId=0;showQueue();$('start').disabled=true;$('stop').disabled=false;
 try{const base=$('server').value.trim().replace(/\/$/,'');const r=await fetch(`${base}/api/radio/calls?after=0`,{headers:{'x-radio-key':$('key').value},cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Erro de conexão');
   if(!running)return;lastId=d.latestId||0;log('Central ligada. Aguardando novas chamadas.');poll();
 }catch(e){$('status').textContent='Erro: '+e.message;running=false;$('start').disabled=false;$('stop').disabled=true;}
};
$('stop').onclick=()=>{running=false;generation++;clearTimeout(timer);speechSynthesis.cancel();queue=[];showQueue();$('status').textContent='Desligada';$('start').disabled=false;$('stop').disabled=true;};
$('test').onclick=async()=>{
 if(speaking||activeTest)return alert('Aguarde a chamada atual terminar.');
 activeTest=true;const gen=generation;$('test').disabled=true;
 try{speechSynthesis.cancel();await announce({model:'Civic',plate:'ABC3B95',origin:'Cão Veio'},gen);}
 catch(e){log('Erro no teste: '+e.message)}
 finally{activeTest=false;$('test').disabled=false;if(running&&queue.length)processQueue();}
};
</script></body></html>
