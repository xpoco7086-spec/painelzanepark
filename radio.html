
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zane Park — Central de Rádio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px;
  background: #0b111b;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 750px;
  margin: auto;
}

h1 {
  color: #ff303d;
  text-align: center;
}

.card {
  background: #182334;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
}

input, select {
  width: 100%;
  padding: 12px;
  background: #0b111b;
  color: white;
  border: 1px solid #455269;
  border-radius: 7px;
  font-size: 16px;
}

button {
  padding: 13px 17px;
  margin: 12px 5px 0 0;
  background: #e51e30;
  color: white;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}

button:disabled {
  opacity: 0.5;
}

#status {
  margin-top: 20px;
  font-weight: bold;
}

#log {
  max-height: 300px;
  overflow-y: auto;
  font-size: 14px;
}

small {
  color: #b8c5d6;
}
</style>
</head>

<body>

<div class="container">

<h1>ZANE PARK — CENTRAL DE RÁDIO</h1>

<p>
Central automática de chamadas de veículos.
Sem bipes, com aviso "Pátio, atenção!".
</p>

<div class="card">

<label>Endereço do painel</label>
<input
  id="server"
  value="https://painelzanepark.onrender.com"
>

<label>Chave RADIO_KEY</label>
<input
  id="key"
  type="password"
  placeholder="Digite sua chave"
>

<label>Voz em português</label>
<select id="voice"></select>

<label>Velocidade da voz</label>
<select id="rate">
  <option value="0.85">0,85 — lenta</option>
  <option value="0.95" selected>0,95 — natural</option>
  <option value="1">1,00 — normal</option>
</select>

<button id="start">Iniciar central</button>
<button id="stop" disabled>Parar central</button>
<button id="test">Testar voz</button>

<p id="status">Central desligada</p>

</div>

<div class="card">

<h2>Fila de chamadas</h2>

<p id="queue">Nenhum veículo aguardando.</p>

<h3>Histórico</h3>

<div id="log"></div>

</div>

</div>

<script>

const $ = id => document.getElementById(id);

let running = false;
let generation = 0;
let lastId = 0;
let queue = [];
let speaking = false;
let testing = false;
let timer = null;
let voices = [];

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve, ms));

// CARREGAR VOZES
function loadVoices() {

  voices = speechSynthesis.getVoices();

  const select = $("voice");
  const previous = select.value;

  select.innerHTML = "";

  voices.forEach((voice, index) => {

    if (!voice.lang.toLowerCase().startsWith("pt")) {
      return;
    }

    const option = document.createElement("option");

    option.value = index;
    option.textContent =
      voice.name + " (" + voice.lang + ")";

    select.appendChild(option);

  });

  if ([...select.options].some(o => o.value === previous)) {
    select.value = previous;
  } else {
    const preferred = [...select.options].find(o =>
      /feminina|female|francisca|maria/i.test(o.textContent)
    );

    if (preferred) select.value = preferred.value;
  }

}

loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;

// PRONÚNCIA DO ESTABELECIMENTO
function spokenOrigin(origin) {

  return String(origin || "")
    .replace(/cão veio/gi, "Cão Vèio");

}

// PRONÚNCIA DA PLACA
function spokenPlate(plate) {

  const cleaned = String(plate || "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .slice(-4)
    .toUpperCase();

  return cleaned.split("").join(" ");

}

// FRASE DO VEÍCULO
function carSentence(c) {

  const model = c.model || "veículo";
  const plate = spokenPlate(c.plate);
  const origin = spokenOrigin(
    c.origin || c.operator || ""
  );

  let text = "Saindo " + model;

  if (plate) {
    text += ", " + plate;
  }

  if (origin) {
    text += ", " + origin;
  }

  return text + ".";

}

// FALAR COM VOZ
function say(text, gen) {

  return new Promise(resolve => {

    if (gen !== generation) {
      resolve();
      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "pt-BR";
    utterance.rate = Number($("rate").value);
    utterance.pitch = 1;
    utterance.volume = 1;

    const voiceIndex = Number($("voice").value);

    if (voices[voiceIndex]) {
      utterance.voice = voices[voiceIndex];
    }

    utterance.onend = resolve;
    utterance.onerror = resolve;

    speechSynthesis.speak(utterance);

  });

}

// HISTÓRICO
function log(message) {

  const p = document.createElement("p");

  p.textContent =
    new Date().toLocaleTimeString("pt-BR") +
    " — " + message;

  $("log").prepend(p);

}

// MOSTRAR FILA
function showQueue() {

  if (!queue.length) {
    $("queue").textContent =
      "Nenhum veículo aguardando.";
    return;
  }

  $("queue").textContent = queue.map(c =>
    (c.model || "Veículo") + " " +
    (c.plate || "") + " — " +
    (c.origin || c.operator || "")
  ).join(" | ");

}

// ANÚNCIO COMPLETO
async function announce(c, gen) {

  const car = carSentence(c);

  // PRIMEIRO AVISO
  log("Pátio, atenção!");

  await say("Pátio, atenção!", gen);

  if (gen !== generation) return;

  // INTERVALO DE 3 SEGUNDOS
  await sleep(3000);

  if (gen !== generation) return;

  // PRIMEIRA CHAMADA DO CARRO
  log(car);

  await say(car, gen);

  if (gen !== generation) return;

  // INTERVALO DE 2,5 SEGUNDOS
  await sleep(2500);

  if (gen !== generation) return;

  // REPETE A CHAMADA COMPLETA
  await say(
    "Pátio, atenção! " + car,
    gen
  );

  if (gen !== generation) return;

  log("Chamada concluída.");

}

// PROCESSAR FILA
async function processQueue() {

  if (speaking || !running || testing) return;

  speaking = true;

  const gen = generation;

  try {

    while (
      running &&
      queue.length &&
      gen === generation
    ) {

      const car = queue.shift();

      showQueue();

      await announce(car, gen);

    }

  } catch (error) {

    log("Erro de áudio: " + error.message);

  } finally {

    speaking = false;

    if (running && queue.length && gen === generation) {
      processQueue();
    }

  }

}

// CONSULTAR SERVIDOR
async function poll() {

  if (!running) return;

  const gen = generation;

  try {

    const base = $("server").value
      .trim()
      .replace(/\/$/, "");

    const response = await fetch(
      base + "/api/radio/calls?after=" + lastId,
      {
        headers: {
          "x-radio-key": $("key").value
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.ok) {
      throw new Error(
        data.message || "Erro do servidor"
      );
    }

    if (!running || gen !== generation) return;

    const calls = Array.isArray(data.calls)
      ? data.calls
      : [];

    for (const car of calls) {

      const id = Number(car.id);

      if (id > lastId) {

        lastId = id;

        queue.push(car);

        log(
          "Recebido: " +
          (car.model || "Veículo") +
          " " +
          (car.plate || "")
        );

      }

    }

    $("status").textContent =
      "Central conectada — aguardando chamadas";

    showQueue();

    processQueue();

  } catch (error) {

    if (running && gen === generation) {
      $("status").textContent =
        "Erro: " + error.message;
    }

  }

  if (running && gen === generation) {
    timer = setTimeout(poll, 1000);
  }

}

// INICIAR CENTRAL
$("start").onclick = async () => {

  if (!$("key").value.trim()) {

    alert("Digite sua RADIO_KEY.");
    return;

  }

  running = true;
  generation++;

  const gen = generation;

  lastId = 0;
  queue = [];

  showQueue();

  $("start").disabled = true;
  $("stop").disabled = false;

  $("status").textContent = "Conectando...";

  try {

    const base = $("server").value
      .trim()
      .replace(/\/$/, "");

    const response = await fetch(
      base + "/api/radio/calls?after=0",
      {
        headers: {
          "x-radio-key": $("key").value
        },
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.ok) {
      throw new Error(
        data.message || "Erro do servidor"
      );
    }

    if (!running || gen !== generation) return;

    lastId = Number(data.latestId) || 0;

    log("Central iniciada.");

    poll();

  } catch (error) {

    if (gen !== generation) return;

    running = false;

    $("status").textContent =
      "Erro: " + error.message;

    $("start").disabled = false;
    $("stop").disabled = true;

  }

};

// PARAR CENTRAL
$("stop").onclick = () => {

  running = false;
  generation++;

  clearTimeout(timer);

  speechSynthesis.cancel();

  queue = [];

  showQueue();

  $("status").textContent = "Central desligada";

  $("start").disabled = false;
  $("stop").disabled = true;

};

// TESTE DE VOZ
$("test").onclick = async () => {

  if (testing || speaking) {
    alert("Aguarde o anúncio atual terminar.");
    return;
  }

  testing = true;
  $("test").disabled = true;

  const gen = generation;

  const car = {
    model: "Civic",
    plate: "ABC3B95",
    origin: "Cão Veio"
  };

  try {

    await announce(car, gen);

  } catch (error) {

    log("Erro no teste: " + error.message);

  } finally {

    testing = false;
    $("test").disabled = false;

    if (running) processQueue();

  }

};

</script>

</body>
</html>
