<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZANE PARK — Painel</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b111b;
  --panel:#111a28;
  --card:#182334;
  --red:#ff1f2d;
  --text:#f5f7fb;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.screen{
  width:100vw;
  height:100vh;
  min-height:560px;
  padding:2.2vh 2.5vw 1.8vh;
  background:
    radial-gradient(circle at 75% 20%,rgba(255,40,50,.08),transparent 25%),
    linear-gradient(135deg,#101927 0%,#090e17 100%);
  display:flex;
  flex-direction:column;
}

.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  height:12%;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:40px;
  height:30px;
  position:relative;
}

.brand-mark:before,
.brand-mark:after{
  content:"";
  position:absolute;
  left:0;
  width:34px;
  height:12px;
  background:var(--red);
  border-radius:50% 10% 50% 10%;
  transform:skewX(-28deg) rotate(-8deg);
}

.brand-mark:before{top:2px}

.brand-mark:after{
  bottom:2px;
  transform:skewX(28deg) rotate(8deg);
}

.brand h1{
  margin:0;
  font-size:clamp(24px,3vw,44px);
  font-weight:900;
}

.clock{
  text-align:right;
  font-weight:900;
}

.clock .time{
  font-size:clamp(28px,3.8vw,58px);
}

.clock .date{
  margin-top:8px;
  font-size:clamp(12px,1.3vw,20px);
}

.content{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,58%) minmax(0,42%);
  gap:2vw;
}

.current{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.current-title,
.history-title{
  font-weight:900;
  font-size:clamp(22px,2.4vw,40px);
}

.current-title{
  background:linear-gradient(90deg,#ff202d,#e71b27);
  padding:12px 20px;
  border-radius:13px 13px 0 0;
}

.current-box{
  border:3px solid #d9222c;
  border-top:0;
  border-radius:0 0 14px 14px;
  background:linear-gradient(180deg,#0c121c,#101827);
  min-height:39vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2vh 2vw;
}

.current-info{
  width:100%;
  text-align:center;
}

.model-current{
  font-weight:900;
  font-size:clamp(28px,3.2vw,58px);
  text-transform:uppercase;
  overflow:hidden;
  text-overflow:ellipsis;
}

.plate{
  font-weight:900;
  font-size:clamp(52px,8vw,150px);
  color:#ff5a60;
  text-transform:uppercase;
  text-shadow:
    0 0 16px rgba(255,55,65,.55),
    0 0 38px rgba(255,30,40,.22);
}

.origin{
  font-weight:900;
  font-size:clamp(28px,3.6vw,64px);
  margin:2vh 0 0 2vw;
  text-transform:uppercase;
}

.history{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.history-title{
  margin:4px 0 14px;
}

.grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  min-width:0;
  min-height:0;
  background:linear-gradient(145deg,#1b2738,#151f2d);
  border-radius:10px;
  border-bottom:6px solid var(--red);
  padding:12px 10px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden;
}

.card .time{
  font-size:clamp(13px,1.4vw,22px);
  font-weight:800;
}

.card .model-small{
  font-size:clamp(13px,1.35vw,21px);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card .plate-small{
  font-size:clamp(13px,1.35vw,21px);
  font-weight:900;
  color:#ff6670;
