<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Zane Park</title><link rel="stylesheet" href="/styles.css"></head><body><main class="panel"><header><b>ZANE PARK</b><button id="sound">🔊 Ativar som e voz</button></header><section id="current" class="current"><small>AGUARDANDO CHAMADA</small><strong id="model">—</strong><strong id="plate">—</strong><span id="origin">—</span></section><h2>Últimos 8 chamados</h2><div id="list"></div></main><script src="/socket.io/socket.io.js"></script><script>
let q=[],busy=false,history=[],ready=false,ctx;
sound.onclick=()=>{ready=true;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();speechSynthesis.cancel();sound.textContent="🔊 Som e voz ativados"};
function esc(x){return String(x).replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]))}
function render(){list.innerHTML=history.slice(0,8).map((c,i)=>'<div class="row"><b>'+(i+1)+'</b><span><strong>'+esc(c.model)+'</strong><small>'+(c.plate?esc(c.plate):"Sem placa")+' · '+esc(c.origin)+'</small></span></div>').join("")}
function beeps(){if(!ready)return;ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let n=ctx.currentTime,g=ctx.createGain();g.connect(ctx.destination);g.gain.value=.0001;[0,.42,.84].forEach(t=>{let o=ctx.createOscillator();o.frequency.value=880;o.connect(g);o.start(n+t);o.stop(n+t+.2)});g.gain.exponentialRampToValueAtTime(.0001,n+1.1)}
function voice(c){if(!ready)return;speechSynthesis.cancel();let p=c.plate?c.plate.split("").join(" "):"",u=new SpeechSynthesisUtterance("Saindo. Veículo "+c.model+"."+ (p?" Placa "+p+".":"") +" Origem "+c.origin+".");u.lang="pt-BR";u.rate=.92;speechSynthesis.speak(u)}
function next(){if(busy||!q.length)return;busy=true;let c=q.shift();model.textContent=c.model;plate.textContent=c.plate||"SEM PLACA";origin.textContent="ORIGEM: "+c.origin;current.classList.remove("flash");void current.offsetWidth;current.classList.add("flash");beeps();setTimeout(()=>voice(c),1200);setTimeout(()=>{busy=false;next()},6000)}
async function load(){let d=await fetch("/api/calls").then(r=>r.json());history=d.calls||[];render()}
io().on("new-call",c=>{history=[c,...history.filter(x=>x.id!==c.id)].slice(0,8);render();q.push(c);next()});load();
</script></body></html>
