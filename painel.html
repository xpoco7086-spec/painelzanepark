<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Painel - Estacionamento</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="panel-body">
  <header class="panel-header">
    <div class="brand"><span class="brand-mark">≈</span><span>ZANE PARK</span></div>
    <div class="clock">
      <div id="time">--:--</div>
      <small id="date">--</small>
    </div>
  </header>

  <main class="panel-grid">
    <section class="current-box" id="currentBox">
      <div class="section-title">SOLICITAÇÃO ATUAL</div>
      <div class="current-content">
        <div id="currentModel" class="current-model">AGUARDANDO</div>
        <div class="plate-label">PLACA</div>
        <div id="currentPlate" class="current-plate">----</div>
        <div id="currentOperator" class="origin">ORIGEM: —</div>
      </div>
    </section>

    <aside class="recent">
      <div class="section-title">ÚLTIMAS SOLICITAÇÕES</div>
      <div id="recentList"></div>
    </aside>
  </main>

  <footer class="panel-footer">
    <span>● ONLINE</span>
    <span>SISTEMA OPERACIONAL • V1.0</span>
  </footer>

  <div id="flash" class="flash-overlay"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const recentList = document.getElementById("recentList");
let audioCtx;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
}
function render(data) {
  const current = data.current || null;
  document.getElementById("currentModel").textContent = current ? current.model : "AGUARDANDO";
  document.getElementById("currentPlate").textContent = current ? current.plate : "----";
  document.getElementById("currentOperator").textContent = current ? "ORIGEM: " + current.operator.toUpperCase() : "ORIGEM: —";

  const items = (data.recent || []).slice(0,4);
  recentList.innerHTML = items.map((x,i) => `
    <div class="recent-item ${i===0 ? "latest":""}">
      <div class="recent-time">${formatTime(x.created_at)}</div>
      <div class="recent-main"><strong>${escapeHtml(x.operator.toUpperCase())}</strong><br>${escapeHtml(x.model)} <span>${escapeHtml(x.plate)}</span></div>
    </div>
  `).join("") || '<div class="empty">Nenhuma solicitação ainda.</div>';
}
function speakCall(call) {
  if (!call || !("speechSynthesis" in window)) return;

  // Fala somente depois dos 3 bipes.
  const plate = String(call.plate || "").split("").join(" ");
  const text = `Saindo. Veículo ${call.model || ""}. Placa ${plate}. Origem ${call.operator || ""}.`;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pt-BR";
  utterance.rate = 0.9;
  utterance.pitch = 1;
  utterance.volume = 1;
  setTimeout(() => window.speechSynthesis.speak(utterance), 1150);
}

function flashAndSound(call) {
  document.body.classList.remove("flash-screen");
  void document.body.offsetWidth;
  document.body.classList.add("flash-screen");
  setTimeout(()=>document.body.classList.remove("flash-screen"), 1800);

  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    const now = audioCtx.currentTime;
    // Três bips fortes e bem separados para destacar a nova chamada.
    [0, 0.38, 0.76].forEach((t, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = i === 1 ? 950 : 750;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.8, now + t + 0.025);
      g.gain.setValueAtTime(0.8, now + t + 0.22);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.28);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + t);
      o.stop(now + t + 0.3);
    });
  } catch(e) {
    console.warn("Não foi possível reproduzir o som:", e);
  }

  speakCall(call);
}
socket.on("state", render);
socket.on("new-call", call => {
  fetch("/api/calls").then(r=>r.json()).then(render);
  flashAndSound(call);
});

function clock() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("date").textContent =
    now.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"}).toUpperCase();
}
clock(); setInterval(clock,1000);
fetch("/api/calls").then(r=>r.json()).then(render);
</script>
</body>
</html>
